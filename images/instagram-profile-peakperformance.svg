<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">PeakPerformance Instagram profile image</title>
  <desc id="desc">A dark circular profile graphic with the PeakPerformance wordmark and a red outline.</desc>
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2746" />
      <stop offset="100%" stop-color="#101628" />
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#243157" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="#0d1220" />
  <circle cx="540" cy="540" r="470" fill="url(#bgGlow)" filter="url(#softShadow)" />
  <circle cx="540" cy="540" r="470" fill="url(#innerGlow)" />
  <circle cx="540" cy="540" r="456" fill="none" stroke="#e63946" stroke-width="12" stroke-opacity="0.95" />
  <circle cx="540" cy="540" r="426" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.18" />

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="540" y="565" font-size="94" font-weight="800" letter-spacing="0" fill="#ffffff">Peak<tspan fill="#e63946">Performance</tspan></text>
  </g>
</svg>